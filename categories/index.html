<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <script>
    (function(){var t=localStorage.getItem('preferred-theme');if(t!=='light'&&t!=='dark'){t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'}document.documentElement.dataset.theme=t})();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分类 · Mufire-star</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
    .cat-card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 14px 16px; transition: border-color var(--transition); }
    .cat-card:hover { border-color: var(--accent-soft); }
    .cat-card-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
    .cat-card-head h2 { font-size: 0.95rem; font-weight: 600; color: var(--ink); margin: 0; }
    .cat-card-head .badge { font-size: 0.7rem; color: var(--ink-faint); background: var(--line); padding: 1px 6px; border-radius: 8px; }
    .cat-card-list { display: flex; flex-direction: column; gap: 4px; }
    .cat-card-list a { font-size: 0.85rem; padding: 3px 10px; border-radius: 4px; color: var(--ink-soft); transition: all var(--transition); display: flex; align-items: center; gap: 6px; }
    .cat-card-list a::before { content: "\25B6"; font-size: 0.6rem; color: var(--accent); opacity: 0.6; }
    .cat-card-list a:hover { background: var(--accent-soft); color: var(--accent); text-decoration: none; }
    .cat-card-empty { font-size: 0.82rem; color: var(--ink-faint); font-style: italic; }
    @media (max-width: 640px) { .cat-grid { grid-template-columns: 1fr; } }
  </style>
  <script defer src="../scripts/theme.js"></script>
</head>
<body>
